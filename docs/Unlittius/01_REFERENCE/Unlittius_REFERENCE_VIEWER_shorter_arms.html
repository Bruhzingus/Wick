<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unlittius — Detailed Claw Wraith Viewer</title>
<style>
:root{--border:#322b3b;--text-primary:#e8dcc4;--text-secondary:#b9adc5;--text-muted:#91869f;--surface-1:#17131d}
*{box-sizing:border-box}body{margin:0;background:#0b0910;color:var(--text-primary);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(1180px,calc(100% - 28px));margin:22px auto 32px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
button:hover{border-color:#6f5a83!important;background:#211a2a!important} input[type=range]{accent-color:#8a5cf0}
</style>
</head>
<body>
<main>
<h2 class="sr-only">3D viewer for Unlittius sorcerer revision: an armored floating cave deity with hooked talons, broad ragged cape, conjured two-boulder burst, summoning gestures, melee attack, compact levitating base, and ceiling-relief banishment.</h2>

<div id="states" style="display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap"></div>

<div style="position:relative;border-radius:12px;overflow:hidden;background:#06050a;border:0.5px solid var(--border)">
<canvas id="cv" style="display:block;width:100%;height:450px"></canvas>
<div style="position:absolute;top:10px;left:12px;pointer-events:none">
<div style="font-size:17px;font-weight:600;color:#e8dcc4;letter-spacing:1px">UNLITTIUS</div>
<div id="sub" style="font-size:12px;color:#9d8fb0;margin-top:2px"></div>
</div>
<div id="prog" style="position:absolute;top:10px;right:12px;text-align:right;pointer-events:none;font-size:11px;color:#9d8fb0;line-height:1.5"></div>
<div id="err" style="display:none;padding:1.25rem;font-size:14px;color:var(--text-secondary);background:var(--surface-1)"></div>
</div>

<div style="display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap" id="vars"></div>
<div style="display:flex;gap:6px;margin:8px 0 0;flex-wrap:wrap" id="misc"></div>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:12px 0 0">
<div style="display:flex;align-items:center;gap:8px">
<label for="cd" style="font-size:12px;color:var(--text-secondary);min-width:62px">Candles lit</label>
<input type="range" id="cd" min="0" max="8" value="0" step="1" style="flex:1">
<span id="cdv" style="font-size:12px;font-weight:500;min-width:26px;text-align:right">0/8</span>
</div>
<div style="display:flex;align-items:center;gap:8px">
<label for="br" style="font-size:12px;color:var(--text-secondary);min-width:62px">Your flame</label>
<input type="range" id="br" min="0" max="100" value="45" step="1" style="flex:1">
</div>
<div style="display:flex;align-items:center;gap:8px">
<label for="sp" style="font-size:12px;color:var(--text-secondary);min-width:62px">Speed</label>
<input type="range" id="sp" min="10" max="200" value="100" step="5" style="flex:1">
</div>
</div>

<p id="note" style="font-size:13px;color:var(--text-muted);margin:12px 0 0;line-height:1.5"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const cv=document.getElementById('cv'),eb=document.getElementById('err');
function fail(m){cv.style.display='none';eb.style.display='block';eb.textContent=m}
if(typeof THREE==='undefined'){fail('3D library failed to load.');return}
let R;try{R=new THREE.WebGLRenderer({canvas:cv,antialias:true})}catch(e){fail('WebGL unavailable.');return}
try{
R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFShadowMap;
const S=new THREE.Scene();S.background=new THREE.Color(0x06050a);S.fog=new THREE.FogExp2(0x06050a,0.019);
const C=new THREE.PerspectiveCamera(48,2,0.1,400);
const amb=new THREE.AmbientLight(0x241d28,0.22);S.add(amb);
const fillL=new THREE.HemisphereLight(0x8a7a6a,0x181420,0);S.add(fillL);
const lamp=new THREE.PointLight(0xffa348,1,70,1.7);lamp.castShadow=true;
lamp.shadow.mapSize.set(1024,1024);lamp.shadow.bias=-0.004;S.add(lamp);
const wick=new THREE.Mesh(new THREE.SphereGeometry(0.2,8,6),new THREE.MeshBasicMaterial({color:0xffd79a}));S.add(wick);
// his own light: cold, and it dies as candles are lit
const rune=new THREE.PointLight(0x8a5cf0,2.2,46,1.9);rune.position.set(0,7,0);S.add(rune);

const rad=d=>d*Math.PI/180;
const BOX=new THREE.BoxGeometry(1,1,1),SPH=new THREE.SphereGeometry(0.5,12,9);
const WED=(function(){const A=[-.5,-.5,-.5],B=[.5,-.5,-.5],Cc=[.5,.5,-.5],D=[-.5,.5,-.5],E=[-.5,-.5,.5],F=[.5,-.5,.5];
const t=[A,D,Cc,A,Cc,B,A,B,F,A,F,E,D,F,Cc,D,E,F,A,E,D,B,Cc,F];const a=new Float32Array(t.length*3);let i=0;
for(const p of t){a[i++]=p[0];a[i++]=p[1];a[i++]=p[2]}const g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.BufferAttribute(a,3));g.computeVertexNormals();return g})();

const PAL={
regular:{rock:[0x7d6a52,0x6c5b46,0x8a7660,0x5d4e3d],dark:[0x3a3128,0x2e271f],
 rune:0x8a5cf0,runeL:0x8a5cf0,cand:0xffb45c,wall:0x5f5142},
moss:{rock:[0x5c6a4a,0x4e5a40,0x6a7a54,0x424c36],dark:[0x2c3326,0x232920],
 rune:0x74e04c,runeL:0x74e04c,cand:0xffb45c,wall:0x46503a},
ice:{rock:[0x8494a2,0x738290,0x95a6b4,0x5e6b78],dark:[0x39434e,0x2c343d],
 rune:0x5ce8ff,runeL:0x5ce8ff,cand:0xffb45c,wall:0x4e5a66}};
let VAR='regular';
function M(role,i){const p=PAL[VAR];let c,rg=0.94,mt=0.02;
if(role==='rock')c=p.rock[(i||0)%4];else if(role==='dark')c=p.dark[(i||0)%2];
else if(role==='wall')c=p.wall;else c=p.rock[0];
return new THREE.MeshStandardMaterial({color:c,roughness:rg,metalness:mt,flatShading:true})}
function RUNE(){return new THREE.MeshBasicMaterial({color:PAL[VAR].rune,transparent:true,opacity:0.9})}

function G(p,x,y,z,rx,ry,rz){const g=new THREE.Group();g.position.set(x||0,y||0,z||0);
g.rotation.order='YXZ';g.rotation.set(rx||0,ry||0,rz||0);g.userData.b=g.quaternion.clone();p.add(g);return g}
function PS(g,rx,ry,rz){if(!g)return;const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0,ry||0,rz||0,'YXZ'));
g.quaternion.copy(g.userData.b).multiply(q)}
function B(p,m,x,y,z,w,h,d,rx,ry,rz,sh){const o=new THREE.Mesh(BOX,m);o.position.set(x,y,z);
o.rotation.order='YXZ';o.rotation.set(rx||0,ry||0,rz||0);o.scale.set(w,h,d);
o.castShadow=sh!==false;o.receiveShadow=true;p.add(o);return o}
function W(p,m,x,y,z,w,h,d,rx,ry,rz,sh){const o=new THREE.Mesh(WED,m);o.position.set(x,y,z);
o.rotation.order='YXZ';o.rotation.set(rx||0,ry||0,rz||0);o.scale.set(w,h,d);
o.castShadow=sh!==false;o.receiveShadow=true;p.add(o);return o}

// keyframe evaluator, same contract as EnemyKit.evaluate
const EASE={linear:t=>t,inQuad:t=>t*t,outQuad:t=>1-(1-t)*(1-t),
inOutQuad:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,inCubic:t=>t*t*t,outCubic:t=>1-Math.pow(1-t,3),
inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,inQuart:t=>t*t*t*t,outQuart:t=>1-Math.pow(1-t,4),
outBack:t=>1+2.70158*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2),
outBounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d){t-=1.5/d;return n*t*t+.75}
if(t<2.5/d){t-=2.25/d;return n*t*t+.9375}t-=2.625/d;return n*t*t+.984375},
outElastic:t=>t===0||t===1?t:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI/3))+1};
function TR(k,l){let L=0;for(const x of k)if(x.t>L)L=x.t;return{keys:k,length:L,loop:!!l}}
function LV(K,u,n){for(let i=u;i>=0;i--){const v=K[i].pose[n];if(v)return v}return[0,0,0]}
function EV(J,tr,time){let t=time;
if(tr.loop&&tr.length>0)t=t%tr.length;else t=Math.max(0,Math.min(t,tr.length));
const K=tr.keys;let a=0,b=0;
for(let i=0;i<K.length;i++)if(K[i].t<=t){a=i;b=Math.min(i+1,K.length-1)}
const ka=K[a],kb=K[b],sp=kb.t-ka.t;
const raw=sp>0?(t-ka.t)/sp:1;const fn=EASE[kb.ease||'inOutCubic']||EASE.inOutCubic;
const k=fn(Math.max(0,Math.min(raw,1)));
for(const n in J){const va=ka.pose[n]||LV(K,a,n);const vb=kb.pose[n]||va;
PS(J[n],va[0]+(vb[0]-va[0])*k,va[1]+(vb[1]-va[1])*k,va[2]+(vb[2]-va[2])*k)}}

// ================= CHAMBER =================
const RADIUS=27,CEIL=19,NCAND=8;
let chamber=null,candles=[],drips=[],runeMeshes=[],heart=null,eyes=[];
function buildChamber(){
const g=new THREE.Group();
const fm=M('wall');
const fl=new THREE.Mesh(new THREE.CircleGeometry(RADIUS+3,26),fm);
fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;g.add(fl);
// wall ring, faceted
for(let i=0;i<22;i++){const a=i/22*6.28;
const h=CEIL+Math.sin(i*1.7)*2.5;
B(g,M('rock',i),Math.cos(a)*(RADIUS+2),h/2,Math.sin(a)*(RADIUS+2),
 7.2,h,4.5,rad(Math.sin(i)*4),-a,rad(Math.cos(i*1.3)*5));
if(i%3===0)B(g,M('dark',i),Math.cos(a)*(RADIUS-0.6),1.2+Math.abs(Math.sin(i*2.1))*2.4,Math.sin(a)*(RADIUS-0.6),
 3.4,3.6,2.6,0,-a+rad(14),rad(Math.sin(i)*10))}
// ceiling ring
for(let i=0;i<16;i++){const a=i/16*6.28+0.2;
B(g,M('rock',i+1),Math.cos(a)*11,CEIL+1.2,Math.sin(a)*11,9,3,9,rad(Math.sin(i)*6),-a,rad(Math.cos(i)*6))}
B(g,M('rock',2),0,CEIL+1.6,0,16,3,16,0,rad(20),0);
// dais
for(let i=0;i<9;i++){const a=i/9*6.28;
B(g,M('dark',i),Math.cos(a)*4.2,0.5,Math.sin(a)*4.2,3.4,1.1,2.6,0,-a,rad(Math.sin(i)*6))}
B(g,M('rock',3),0,0.7,0,7,1.5,7,0,rad(22),0);
// rubble scatter
for(let i=0;i<26;i++){const a=i*2.399,r=6+Math.sqrt(i/26)*(RADIUS-8);
const s=0.5+Math.random()*1.5;
B(g,M('rock',i),Math.cos(a)*r,s*0.28,Math.sin(a)*r,s,s*0.5,s*0.8,
 Math.random()*0.5,Math.random()*6.28,Math.random()*0.5)}
// hanging dripstone
drips=[];
for(let i=0;i<14;i++){const a=i/14*6.28+0.4,r=7+((i*7)%13);
const len=2.2+((i*5)%4);
const d=G(g,Math.cos(a)*r,CEIL,Math.sin(a)*r,0,0,0);
let py=0;for(let k=0;k<4;k++){const w=0.9*(1-k/5);
B(d,M('rock',i+k),0,py-len/8,0,w,len/4,w,rad(Math.sin(k)*7),k*0.6,rad(Math.cos(k)*7));py-=len/4}
d.userData={x:Math.cos(a)*r,z:Math.sin(a)*r,t:i*0.37,len:len};drips.push(d)}
// candle stands
candles=[];
for(let i=0;i<NCAND;i++){const a=i/NCAND*6.28+0.39,r=RADIUS-6.5;
const st=G(g,Math.cos(a)*r,0,Math.sin(a)*r,0,-a,0);
for(let k=0;k<3;k++)B(st,M('dark',k),0,0.5+k*0.9,0,1.1-k*0.16,0.95,1.0-k*0.14,0,rad(k*24),0);
B(st,M('rock',i),0,3.05,0,1.5,0.4,1.5,0,rad(18),0);
const wax=B(st,M('rock',1),0,3.55,0,0.55,0.75,0.55,0,0,0);
const fm2=new THREE.MeshBasicMaterial({color:0xffc266,transparent:true,opacity:0});
const flame=new THREE.Mesh(SPH,fm2);flame.scale.set(0.42,0.72,0.42);flame.position.y=4.15;st.add(flame);
const pl=new THREE.PointLight(0xffb45c,0,26,1.8);pl.position.set(0,4.2,0);st.add(pl);
candles.push({grp:st,flame:flame,light:pl,x:Math.cos(a)*r,z:Math.sin(a)*r})}
S.add(g);return g}

// ================= UNLITTIUS =================
let boss=null;
function buildBoss(){
const r=new THREE.Group();r.position.set(0,0,0);const J={};
runeMeshes=[];eyes=[];

// Final reference pass: slightly shorter arms, natural resting pose, claws angled inward/downward,
// intimidating chest/shoulders, short floating base, and a scraggly cape instead
// of the old back lantern rig.
const core=G(r,0,7.65,0,0,0,0);J.core=core;
const ICO=new THREE.IcosahedronGeometry(1,0);
const OCT=new THREE.OctahedronGeometry(1,0);
const UP=new THREE.Vector3(0,1,0);
function ROCK(p,m,x,y,z,sx,sy,sz,rx,ry,rz,geo){
  const o=new THREE.Mesh(geo||ICO,m);o.position.set(x||0,y||0,z||0);o.scale.set(sx||1,sy||1,sz||1);
  o.rotation.order='YXZ';o.rotation.set(rx||0,ry||0,rz||0);o.castShadow=true;o.receiveShadow=true;p.add(o);return o
}
function SEG(p,m,a,b,r0,r1,sides){
  const A=new THREE.Vector3(a[0],a[1],a[2]),Bv=new THREE.Vector3(b[0],b[1],b[2]);
  const d=Bv.clone().sub(A),len=d.length();
  const g=new THREE.CylinderGeometry(r1==null?r0:r1,r0,len,sides||5,1,false);
  const o=new THREE.Mesh(g,m);o.position.copy(A.clone().add(Bv).multiplyScalar(.5));
  o.quaternion.setFromUnitVectors(UP,d.clone().normalize());o.castShadow=true;o.receiveShadow=true;p.add(o);return o
}
function addClaw(hand,side){
  // A compact stone palm feeding into three oversized hooked talons.
  // Deliberately avoids a human finger silhouette.
  ROCK(hand,M('rock',2),0,.02,-.34,.66,.42,.72,rad(10),rad(side*5),rad(side*5));
  ROCK(hand,M('dark',0),0,-.02,-.62,.56,.30,.54,rad(18),0,0);
  const spread=[-.46,0,.46];
  for(let i=0;i<3;i++){
    const x=spread[i];
    const b=[x*.82,-.04,-.68];
    const m=[x*.98,-.30,-1.34];
    const t=[x*.78,-.94,-2.08-(i===1?.16:0)];
    SEG(hand,M('rock',i),b,m,.16,.105,4);
    SEG(hand,M('dark',i),m,t,.11,.022,4);
    // blade-like hooked tip
    W(hand,M('rock',i+1),t[0],t[1]-.12,t[2]-.18,.18,.72,.16,rad(116),rad(side*(8+i*4)),rad((i-1)*10));
  }
  // One large opposing thumb claw.
  const sx=side<0?-1:1;
  SEG(hand,M('rock',3),[sx*.56,.04,-.52],[sx*.94,-.18,-1.02],.17,.105,4);
  SEG(hand,M('dark',0),[sx*.94,-.18,-1.02],[sx*.72,-.72,-1.56],.11,.025,4);
  W(hand,M('rock',1),sx*.68,-.88,-1.72,.18,.64,.16,rad(112),0,rad(sx*24));
}

// ---------- short floating lower body ----------
const rubble=[];
const baseDefs=[
 {x:0,y:-1.70,z:0,sx:1.42,sy:.58,sz:1.08,ry:10},
 {x:-.20,y:-2.28,z:.04,sx:1.00,sy:.44,sz:.80,ry:-20},
 {x:.16,y:-2.72,z:-.04,sx:.72,sy:.34,sz:.58,ry:24}
];
for(let i=0;i<baseDefs.length;i++){const q=baseDefs[i];const c=G(core,q.x,q.y,q.z,0,rad(q.ry),0);
 ROCK(c,M('rock',i+1),0,0,0,q.sx,q.sy,q.sz,rad(i%2?8:-6),0,rad((i-1)*4));
 c.userData={a:i*2.1,rr:.08+i*.04,y:q.y,spin:i%2?-.13:.16};rubble.push(c)}
for(let i=0;i<5;i++){const a=.25+i*1.24,rr=1.20+(i%2)*.26,y=-2.05-(i%3)*.30;
 const c=G(core,Math.cos(a)*rr,y,Math.sin(a)*rr,0,0,0);ROCK(c,M('rock',i+2),0,0,0,.26+.05*(i%2),.20,.24,rad(i*13),rad(i*31),rad(i*11));
 c.userData={a:a,rr:rr,y:y,spin:i%2?-.22:.27};rubble.push(c)}

// ---------- torso: broad, layered, threatening ----------
const torso=G(core,0,.34,0,rad(1),0,0);J.torso=torso;
ROCK(torso,M('dark',0),0,.10,.08,1.92,1.42,1.08,0,0,0);
for(let i=0;i<6;i++){
 const y=1.08-i*.42,w=1.88-i*.12;
 ROCK(torso,M('rock',i),0,y,-.12-i*.05,w,.26,.84,rad(-10+i*3),rad((i%2?1:-1)*7),0);
}
for(const sd of[-1,1]){
 ROCK(torso,M('rock',sd<0?2:3),sd*1.50,.52,-.02,.58,.90,.86,rad(10),rad(sd*18),rad(sd*12));
 ROCK(torso,M('dark',1),sd*1.30,-.42,.08,.40,.64,.70,rad(-5),rad(sd*12),rad(sd*8));
}
B(torso,M('dark',0),0,.30,-1.02,1.48,1.34,.34,0,0,0);
const hm=RUNE();heart=new THREE.Mesh(OCT,hm);heart.scale.set(.50,.70,.28);heart.position.set(0,.30,-1.26);heart.rotation.z=rad(45);torso.add(heart);runeMeshes.push(heart);
for(let i=0;i<4;i++){const q=new THREE.Mesh(BOX,RUNE());q.scale.set(.055,.32+i*.04,.045);q.position.set((i-1.5)*.34,-.50+Math.sin(i)*.08,-1.20);q.rotation.z=rad((i-1.5)*14);torso.add(q);runeMeshes.push(q)}
const pelv=G(core,0,-1.16,0,0,0,0);J.pelv=pelv;
ROCK(pelv,M('rock',3),0,0,0,1.34,.60,.92,0,rad(9),0);

// ---------- shoulders + arms ----------
for(const sd of[-1,1]){const tag=sd<0?'L':'R';
 const sh=G(torso,sd*1.88,.80,-.02,0,0,0);J['sh'+tag]=sh;
 ROCK(sh,M('rock',3),0,0,0,.92,.72,.90,0,rad(sd*14),rad(sd*-8));
 ROCK(sh,M('rock',1),sd*.40,.16,-.06,.74,.52,.76,rad(-8),rad(sd*18),rad(sd*10));
 for(let k=0;k<3;k++)W(sh,M('rock',k),sd*(.12+k*.26),.60+k*.08,.04+k*.14,.34,1.30-k*.18,.38,rad(-18),rad(sd*(18+k*18)),rad(sd*9));

 const up=G(sh,sd*.24,-.46,-.02,rad(-52),rad(sd*-7),rad(sd*5));J['up'+tag]=up;
 ROCK(up,M('dark',1),0,0,-.80,.38,.44,1.02,0,0,0);
 ROCK(up,M('rock',1),0,-.02,-1.38,.42,.46,.74,rad(4),rad(sd*4),0);
 B(up,M('dark',0),0,.02,-1.88,.84,.66,.46,0,rad(sd*10),0);

 const fo=G(up,0,-.08,-1.96,rad(16),rad(sd*6),rad(sd*-3));J['fo'+tag]=fo;
 ROCK(fo,M('rock',2),0,0,-.86,.38,.44,1.02,rad(1),0,0);
 ROCK(fo,M('dark',1),0,-.04,-1.45,.34,.40,.66,rad(-3),rad(sd*-5),0);
 B(fo,M('dark',0),0,0,-1.90,.92,.70,.46,0,rad(sd*-8),0);
 W(fo,M('rock',0),sd*.34,.10,-1.08,.24,.80,.26,rad(80),rad(sd*12),rad(sd*6));
 const rs=new THREE.Mesh(BOX,RUNE());rs.scale.set(.05,.05,.76);rs.position.set(sd*.24,0,-1.02);fo.add(rs);runeMeshes.push(rs);

 const hd=G(fo,0,.02,-1.98,rad(12),rad(sd*-10),rad(sd*-10));J['hd'+tag]=hd;addClaw(hd,sd);
}

// ---------- head: pointed stone hood + void face ----------
const neck=G(torso,0,1.54,0,0,0,0);J.neck=neck;ROCK(neck,M('dark',1),0,0,0,.45,.36,.44,0,0,0);
const head=G(neck,0,.72,-.04,0,0,0);J.head=head;
ROCK(head,M('dark',0),0,-.20,.02,.72,.74,.66,0,0,0);
B(head,M('dark',1),0,-.18,-.70,1.12,1.22,.18,0,0,0);

if(st==='banish'){
 const k=Math.max(0,Math.min(t/3.4,1)),s=k*k*(3-2*k);
 const rk=Math.max(0,Math.min((t-.55)/1.85,1)),rs=rk*rk*(3-2*rk);
 // The root ends slightly inside the ceiling; after the -90deg roll, the face,
 // chest and claws protrude as a relief while the cape is buried above it.
 boss.root.position.y=(CEIL+.55)*s;
 boss.root.rotation.x=-Math.PI*.5*rs;
 boss.root.scale.z=1-.18*rs;
}else{
 boss.root.position.y=hov*.35;
 if(st==='melee'){
  const p=t%1.55;let l=0;if(p>.26&&p<.92){const q=(p-.26)/.66;l=Math.sin(q*Math.PI)*1.45}
  boss.root.position.z=-l;
 }
}
// compact levitating base: subtle counter-rotation
for(let i=0;i<boss.rubble.length;i++){const c=boss.rubble[i],u=c.userData;
const a=u.a+t*(u.spin||0.16);
c.position.set(Math.cos(a)*u.rr,u.y+Math.sin(t*0.9+i)*0.14,Math.sin(a)*u.rr);
c.rotation.y+=dt*(u.spin||0.16)}
// Orbiting fragments remain atmospheric; they rise for spell states but never
// become the boulder projectiles themselves.
for(let i=0;i<boss.shards.length;i++){const s=boss.shards[i],u=s.userData;
 let a=u.a+t*.34,rr=u.rr,yy=u.y;
 if(st==='summon'||st==='call'){const p=st==='summon'?(t%2.6):(t%3.05);const k=Math.min(p/1.35,1);yy=u.y+k*2.8;rr=u.rr*(1-k*.14)}
 else if(st==='banish'){const k=Math.min(t/2.4,1);yy=u.y+k*8;rr=u.rr*(1-k*.34)}
 s.position.set(Math.cos(a)*rr,yy,Math.sin(a)*rr);s.rotation.set(t*.55+i,t*.42,t*.28+i)}
// Dedicated boulder burst: conjure outside the body, then send two shots forward.
for(let i=0;i<boss.boulders.length;i++){const b=boss.boulders[i],u=b.userData;b.visible=st==='boulder';if(!b.visible)continue;
 const p=(t%2.45)-u.delay;
 if(p<0){b.visible=false;continue}
 if(p<.92){const k=Math.max(0,Math.min((p-.18)/.64,1));const e=k*k*(3-2*k);b.position.set(u.sx,8.7,-3.0);b.scale.setScalar(.10+.90*e)}
 else{const k=Math.min((p-.92)/.72,1);b.scale.setScalar(1);b.position.set(u.sx*(1-k*.72),8.7-Math.sin(k*Math.PI)*.30,-3.0-k*25)}
 b.rotation.x=t*(i?-.65:.72);b.rotation.y=t*(i?.80:-.74)}
}

// dripstone falls on the summon snap
for(let i=0;i<drips.length;i++){const d=drips[i],u=d.userData;
if(st==='summon'){const p=(t+u.t)%2.6;
if(p>1.62){const k=Math.min((p-1.62)/0.85,1);
d.position.y=CEIL-k*k*(CEIL-1);d.rotation.z=k*0.4;d.visible=true}
else{d.position.y=CEIL;d.rotation.z=p>1.2?Math.sin(now*0.05+i)*0.03:0;d.visible=true}}
else{d.position.y=CEIL;d.rotation.z=0;d.visible=true}}

C.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,tgt.y+Math.sin(pitch)*dist+2,Math.cos(yaw)*Math.cos(pitch)*dist);
C.lookAt(tgt);R.render(S,C);requestAnimationFrame(loop)
}catch(e){fail('Render error: '+e.message)}}
requestAnimationFrame(loop);
}catch(e){fail('Setup failed: '+e.message)}
})();
